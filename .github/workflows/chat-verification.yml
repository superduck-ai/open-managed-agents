name: Chat verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-chat:
    name: Chat verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMA_WORKER_CONTROL_IMAGE: ${{ vars.OMA_WORKER_CONTROL_IMAGE || 'ghcr.io/superduck-ai/managed-agent-sandbox:latest' }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare local images
        run: |
          for image in postgres:17 redis:8 nats:2.14.6-alpine pgsty/minio:latest "$OMA_WORKER_CONTROL_IMAGE"; do
            docker pull "$image"
          done
          test -e /dev/fuse || sudo modprobe fuse
      - name: Build verification CLI
        run: |
          mkdir -p tmp/bin
          go build -o tmp/bin/verify-chat ./cmd/verify-chat
      - name: Verify chat behavior and reliability
        run: |
          for scenario in chat.roundtrip chat.tools chat.reliability chat.instances chat.public; do
            tmp/bin/verify-chat run "$scenario"
          done
      - name: Measure base commit with current workload
        run: |
          tmp/bin/verify-chat run chat.performance --backend-ref "$BASE_REF"
          jq -s '[.[] | select(.scenario == "chat.performance" and .backend_commit == env.BASE_REF)] | if length == 1 then .[0] else error("expected one baseline") end' tmp/verify-chat/*/report.json > tmp/chat-baseline.json
      - name: Reject performance regression
        run: tmp/bin/verify-chat run chat.performance --baseline tmp/chat-baseline.json
      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-verification-verdicts
          path: |
            tmp/verify-chat/*/report.json
            tmp/verify-chat/*/report.md
          retention-days: 14
          if-no-files-found: warn
