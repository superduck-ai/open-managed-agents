name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/golangci-lint/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/golangci-lint/go.sum

      - name: Generate Go sources
        run: ./scripts/generate-go.sh

      - name: Check Go package ownership
        run: ./scripts/tests/go-packages_test.sh

      - name: Check Go test suite boundaries
        run: ./scripts/tests/test-suites_test.sh

      - name: Run golangci-lint
        run: ./scripts/golangci-lint.sh run --config=.golangci.yml --timeout=5m ./...
