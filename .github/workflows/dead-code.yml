name: Dead code

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'internal/db/*_mapper.xml'
      - 'tools/golangci-lint/**'
      - 'scripts/golangci-lint.sh'
      - 'scripts/go-packages.sh'
      - '.golangci-dead-code.yml'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/generate-go.sh'
      - 'scripts/go-dead-code.sh'
      - '.github/workflows/dead-code.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'internal/db/*_mapper.xml'
      - 'tools/golangci-lint/**'
      - 'scripts/golangci-lint.sh'
      - 'scripts/go-packages.sh'
      - '.golangci-dead-code.yml'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/generate-go.sh'
      - 'scripts/go-dead-code.sh'
      - '.github/workflows/dead-code.yml'

permissions:
  contents: read

concurrency:
  group: dead-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-dead-code:
    name: Go dead-code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/golangci-lint/go.sum

      - name: Generate Go sources
        run: ./scripts/generate-go.sh

      - name: Detect unreachable Go declarations
        run: ./scripts/golangci-lint.sh run --config=.golangci-dead-code.yml --timeout=5m ./...
