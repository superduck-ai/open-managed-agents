# Minimal Open Managed Agents configuration for normal local development.
# Copy this file to config/config.yaml and protect it because it may contain secrets.
# See docs/configuration-reference.yaml for every supported optional field.

env: dev

server:
  addr: 127.0.0.1:38080

database:
  url: postgresql://claude:123456@localhost:5432/claude_api?sslmode=disable
  # Defaults to true for env: dev and false for env: prod when omitted.

redis:
  url: redis://localhost:6379

storage:
  type: s3
  s3:
    endpoint: http://localhost:9000
    bucket: claude-files
    region: us-east-1
    access_key_id: minioadmin
    secret_access_key: minioadmin
    force_path_style: true

anthropic_upstream:
  api_key: ""

web_search:
  # Built-in providers are tavily and brave. Leaving the selected api_key empty disables the gateway.
  provider: tavily
  timeout: 30s
  # Maximum server-tool sampling iterations per request. One iteration is one BYOK model request.
  # This is independent of tools[].max_uses, which limits actual search executions.
  max_server_tool_iterations: 10
  providers:
    tavily:
      # Tavily supports allowed_domains and blocked_domains from the Anthropic tool declaration.
      endpoint: ""
      api_key: ""
    brave:
      # Brave does not support those domain filters; such a request is rejected before BYOK.
      endpoint: ""
      api_key: ""
      options:
        country: US
        search_language: en
        ui_language: en-US
        freshness: ""
        start_published_at: ""
        end_published_at: ""
        safe_search: moderate
        spellcheck: true
        result_filter: web
        goggles: []
        extra_snippets: false
        units: metric

e2b:
  # For e2b-local, use an e2b_ prefix followed by lowercase hex because the
  # client SDK validates the key before contacting a custom API URL.
  api_key: ""
  api_url: ""

vault:
  master_key:
    # Required in every env. Example:
    #   just generate-vault-kek config/secrets/vault-kek
    # then set kek_file: secrets/vault-kek
    # or paste the printed base64 into kek.
    # Documentation placeholder only — replace before real use.
    version: 1
    kek: "rFF/9K42dW9xtX3zvE3rm6HzJshGCVntS62F2884M78="
