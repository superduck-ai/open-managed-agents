version: 1

providers:
  - name: primary
    api_backend: messages
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    model_ids:
      - your-model-id

  - name: compatible
    api_backend: chat_completions
    base_url: https://provider.example
    api_key_file: ./secrets/compatible-api-key
    model_ids:
      - another-model-id
