version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - durationcheck
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - musttag
    - nilnesserr
    - reassign
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
  settings:
    spancheck:
      extra-start-span-signatures:
        - 'github.com/superduck-ai/open-managed-agents/internal/telemetry.StartRoot:opentelemetry'
        - 'github.com/superduck-ai/open-managed-agents/internal/telemetry.Start:opentelemetry'
    revive:
      rules:
        - name: var-naming
  exclusions:
    paths:
      - web/node_modules/

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - web/node_modules/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
